name: Build Windows (PC)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Windows-

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: auto
          buildMethod: AtlasBuild.BuildWindows
          buildName: ATLAS3D
          versioning: None

      # MP4 export on the PC: FFmpeg (LGPL build) next to the program.
      - name: Add FFmpeg (MP4 export)
        run: |
          set -e
          curl -L --fail --retry 4 -o /tmp/ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          unzip -q /tmp/ffmpeg.zip -d /tmp/ffmpeg
          sudo mkdir -p build/StandaloneWindows64/ffmpeg
          sudo cp /tmp/ffmpeg/*/bin/ffmpeg.exe build/StandaloneWindows64/ffmpeg/
          sudo cp /tmp/ffmpeg/*/LICENSE.txt build/StandaloneWindows64/ffmpeg/ || true
          echo "FFmpeg (LGPL) - https://ffmpeg.org - compilado por https://github.com/BtbN/FFmpeg-Builds. ATLAS lo usa para crear los videos MP4." | sudo tee build/StandaloneWindows64/ffmpeg/LEEME.txt
          ls -la build/StandaloneWindows64/ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS3D-Windows
          path: build/StandaloneWindows64
          retention-days: 14
