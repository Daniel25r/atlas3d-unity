name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          # More room: a build ran out of disk («No space left on device»).
          large-packages: true
          docker-images: true
          tool-cache: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: AtlasBuild.BuildAndroid
          buildName: ATLAS3D
          androidExportType: androidPackage
          # Same signing key on every build: each APK installs over the last.
          androidKeystoreName: atlas3d.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          versioning: None

      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS3D-Android
          path: build/Android
          retention-days: 14

      # Public download: a GitHub Release per version (the website's
      # «Descargar para Android» always points to the newest one).
      - name: Publish release (Android)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V=$(grep -oP 'Version = "\K[^"]+' Assets/Atlas/Scripts/Runtime/AtlasApp.cs)
          APK=$(ls build/Android/*.apk | head -1)
          cp "$APK" ATLAS5D-Android.apk
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "ATLAS 5D $V" --notes "ATLAS 5D $V · Android (APK) y Windows (ZIP)." --latest || true
          gh release upload "v$V" ATLAS5D-Android.apk --clobber
